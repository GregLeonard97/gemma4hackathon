<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-label="NeoGuide architecture diagram">
  <defs>
    <style>
      .title { font: 700 28px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #0b1f3a; }
      .label { font: 600 18px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #0b1f3a; }
      .text { font: 400 15px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #102a43; }
      .small { font: 400 13px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #334e68; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 4 L 0 8 z" fill="#486581"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="760" fill="#f7fbff"/>
  <text x="48" y="52" class="title">NeoGuide System Architecture</text>
  <text x="48" y="80" class="small">Mac-side resource build pipeline + iOS on-device RAG runtime</text>

  <rect x="44" y="120" width="520" height="560" rx="14" fill="#eaf3ff" stroke="#9fb3c8"/>
  <text x="66" y="158" class="label">A. Mac Build Pipeline</text>

  <rect x="70" y="186" width="468" height="92" rx="10" fill="#ffffff" stroke="#bcccdc"/>
  <text x="90" y="218" class="text">User-supplied clinical guideline PDFs</text>
  <text x="90" y="242" class="small">data/guidelines/</text>

  <rect x="70" y="304" width="468" height="118" rx="10" fill="#ffffff" stroke="#bcccdc"/>
  <text x="90" y="334" class="text">Ingestion and extraction</text>
  <text x="90" y="358" class="small">PyMuPDF parsing, chunking, table row extraction</text>
  <text x="90" y="380" class="small">ingestion/ingest.py, ingestion/compressed_search.py</text>

  <rect x="70" y="448" width="468" height="118" rx="10" fill="#ffffff" stroke="#bcccdc"/>
  <text x="90" y="478" class="text">Resource build scripts</text>
  <text x="90" y="502" class="small">Vector DB export, codebook build, Core ML conversion</text>
  <text x="90" y="524" class="small">scripts/build_ios_resources.sh (+ helper scripts)</text>

  <line x1="304" y1="278" x2="304" y2="304" stroke="#486581" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="304" y1="422" x2="304" y2="448" stroke="#486581" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="636" y="120" width="520" height="560" rx="14" fill="#eefdf5" stroke="#9fb3c8"/>
  <text x="658" y="158" class="label">B. iOS Runtime Pipeline</text>

  <rect x="662" y="186" width="468" height="92" rx="10" fill="#ffffff" stroke="#bcccdc"/>
  <text x="682" y="216" class="text">App resources bundle</text>
  <text x="682" y="240" class="small">BGESmall.mlpackage, bge_vocab.txt, vector DB artifacts</text>

  <rect x="662" y="304" width="468" height="118" rx="10" fill="#ffffff" stroke="#bcccdc"/>
  <text x="682" y="334" class="text">Query path on device</text>
  <text x="682" y="358" class="small">Embed query - Retrieve top-k chunks - Assemble prompt</text>
  <text x="682" y="380" class="small">GuidelineAssistant/Core/ML/RAGPipeline.swift</text>

  <rect x="662" y="448" width="468" height="118" rx="10" fill="#ffffff" stroke="#bcccdc"/>
  <text x="682" y="478" class="text">Grounded generation and UI citation flow</text>
  <text x="682" y="502" class="small">Gemma 4 on MLX + source-linked answer display</text>
  <text x="682" y="524" class="small">GuidelineAssistant/App/UI + Core/ML/LLMEngine.swift</text>

  <line x1="896" y1="278" x2="896" y2="304" stroke="#486581" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="896" y1="422" x2="896" y2="448" stroke="#486581" stroke-width="3" marker-end="url(#arrow)"/>

  <line x1="538" y1="512" x2="662" y2="512" stroke="#486581" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="548" y="494" class="small">copy generated resources</text>

  <rect x="44" y="700" width="1112" height="40" rx="8" fill="#ffffff" stroke="#d9e2ec"/>
  <text x="64" y="725" class="small">Privacy model: no cloud inference required for runtime usage; users provide institution-specific guideline corpus locally.</text>
</svg>
