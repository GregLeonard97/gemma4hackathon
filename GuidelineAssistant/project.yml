name: GuidelineAssistant
options:
  minimumXcodeGenVersion: 2.38.0
  deploymentTarget:
    iOS: '17.0'
    macOS: '14.0'
settings:
  base:
    SWIFT_VERSION: 5.9
packages:
  MLXSwift:
    url: https://github.com/ml-explore/mlx-swift
    from: 0.31.3
  MLXSwiftLM:
    url: https://github.com/ml-explore/mlx-swift-lm
    from: 3.31.3
  SwiftTransformers:
    url: https://github.com/huggingface/swift-transformers
    from: 1.3.0
  SQLite:
    url: https://github.com/stephencelis/SQLite.swift
    from: 0.15.0
targets:
  GuidelineAssistant:
    type: application
    platform: iOS
    deploymentTarget: '17.0'
    entitlements:
      path: GuidelineAssistant/GuidelineAssistant.entitlements
      properties:
        com.apple.developer.kernel.increased-memory-limit: true
        com.apple.developer.kernel.extended-virtual-addressing: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.greg.GuidelineAssistant
        INFOPLIST_FILE: GuidelineAssistant/Info.plist
        INFOPLIST_KEY_CFBundleIconName: AppIcon
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: GuidelineAssistant/GuidelineAssistant.entitlements
        TARGETED_DEVICE_FAMILY: '1'
        SUPPORTS_MACCATALYST: 'NO'
        SWIFT_VERSION: 5.9
    sources:
      - path: GuidelineAssistant/App
      - path: GuidelineAssistant/Core
      - path: GuidelineAssistant/Models
      - path: GuidelineAssistant/Resources/Assets.xcassets
        buildPhase: resources
      - path: GuidelineAssistant/Resources/BGESmall.mlpackage
        buildPhase: resources
        type: folder
      - path: GuidelineAssistant/Resources/bge_vocab.txt
        buildPhase: resources
      - path: GuidelineAssistant/Resources/bge_tokenizer_config.json
        buildPhase: resources
      - path: GuidelineAssistant/Resources/codebook.json
        buildPhase: resources
      - path: GuidelineAssistant/Resources/guidelines.db
        buildPhase: resources
      - path: GuidelineAssistant/Resources/extracted_tables
        buildPhase: resources
        type: folder
      - path: GuidelineAssistant/Resources/Guidelines
        buildPhase: resources
        type: folder
    dependencies:
      - package: MLXSwift
        product: MLX
      - package: MLXSwift
        product: MLXNN
      - package: MLXSwiftLM
        product: MLXLLM
      - package: MLXSwiftLM
        product: MLXVLM
      - package: MLXSwiftLM
        product: MLXLMCommon
      - package: SwiftTransformers
        product: Hub
      - package: SwiftTransformers
        product: Tokenizers
      - package: SQLite
        product: SQLite

  GuidelineAssistantTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: '17.0'
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.greg.GuidelineAssistantTests
        TARGETED_DEVICE_FAMILY: '1'
        SWIFT_VERSION: 5.9
    sources:
      - path: GuidelineAssistantTests
        excludes:
          - Fixtures/README.md
    resources:
      - path: GuidelineAssistantTests/Fixtures
    dependencies:
      - target: GuidelineAssistant
      - package: SQLite
        product: SQLite

  BackendSmokeTest:
    type: tool
    platform: macOS
    deploymentTarget: '14.0'
    settings:
      base:
        PRODUCT_NAME: BackendSmokeTest
        SWIFT_VERSION: 5.9
    sources:
      - path: SmokeHarness
      - path: GuidelineAssistant/Models
      - path: GuidelineAssistant/Core/ML/PipelineProtocols.swift
      - path: GuidelineAssistant/Core/ML/RAGPipeline.swift
      - path: GuidelineAssistant/Core/Query/AbbreviationExpander.swift
      - path: GuidelineAssistant/Core/Query/TableQueryDetector.swift
      - path: GuidelineAssistant/Core/Storage/GuidelineRepository.swift
      - path: GuidelineAssistant/Core/RAGError.swift

schemes:
  GuidelineAssistant:
    build:
      targets:
        GuidelineAssistant: all
    test:
      targets:
        - GuidelineAssistantTests
  BackendSmokeTest:
    build:
      targets:
        BackendSmokeTest: all
